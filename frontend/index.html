<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf8f6">
  <title>PTIT Chat · Tra cứu sinh viên</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">P</span>
        <div><strong>PTIT Chat</strong><span>Trợ lý sinh viên</span></div>
      </div>
      <button class="new-chat" id="new-chat" type="button"><span aria-hidden="true">＋</span> Cuộc trò chuyện mới</button>
      <nav class="conversations" aria-label="Các cuộc trò chuyện">
        <ul id="conversations"></ul>
      </nav>
      <div class="sidebar-foot">Ngành CNTT · Cơ sở phía Bắc</div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><span class="mobile-brand">PTIT Chat · </span>Tra cứu sinh viên</div>
        <div id="status" class="status" role="status">Đang tải kho tài liệu</div>
        <button class="mobile-new" id="mobile-new" type="button" aria-label="Cuộc trò chuyện mới">＋</button>
      </header>
      <div class="viewport" id="viewport">
        <section class="welcome content-width" id="welcome">
          <div class="welcome-mark" aria-hidden="true"><span></span><span></span><span></span></div>
          <h1>Bạn cần tra cứu gì?</h1>
          <p>Hỏi về chương trình học, thủ tục và thông báo học vụ tại PTIT.</p>
          <div class="suggestions">
            <button class="suggestion" type="button" data-question="CNTT khóa 2025 có bao nhiêu tín chỉ?">
              <span class="topic">Đào tạo</span>
              <span>CNTT khóa 2025 có bao nhiêu tín chỉ?</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <button class="suggestion" type="button" data-question="Mất thẻ sinh viên thì làm lại như thế nào?">
              <span class="topic">Thủ tục</span>
              <span>Mất thẻ sinh viên thì làm lại như thế nào?</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
            <button class="suggestion" type="button" data-question="Học phí học lại lớp riêng kỳ I 2025–2026 môn INT1313 là bao nhiêu?">
              <span class="topic">Học phí</span>
              <span>Học lại lớp riêng môn INT1313 đóng bao nhiêu?</span>
              <span class="arrow" aria-hidden="true">↗</span>
            </button>
          </div>
        </section>
        <section class="messages content-width" id="messages" role="log" aria-label="Cuộc trò chuyện" aria-live="polite" hidden></section>
      </div>
      <footer class="composer">
        <div class="content-width">
          <div class="chat-notice" id="chat-notice" role="status" aria-live="polite" hidden></div>
          <div class="attachment-options" id="attachment-options" role="group" aria-label="Tệp cho câu hỏi tiếp theo" hidden>
            <div id="attachment-name" class="attachment-name"></div>
            <div class="attachment-actions">
              <button id="reuse-file" type="button" aria-pressed="false">Dùng lại tệp</button>
              <button id="replace-file" type="button">Tải tệp mới</button>
              <button id="skip-file" type="button" aria-pressed="false">Không dùng tệp</button>
            </div>
          </div>
          <div class="attachment-status" id="attachment-status" role="status"></div>
          <form id="chat-form">
            <input id="upload-input" type="file" accept=".docx,.pdf,.md,.markdown,.xlsx,.xls" hidden>
            <button class="upload" id="upload" type="button" aria-label="Tải tệp" title="Tải tệp DOCX, PDF, Markdown hoặc Excel (tối đa 10 MB)">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21 11.5-8.3 8.3a5.5 5.5 0 0 1-7.8-7.8l9-9a3.5 3.5 0 0 1 5 5l-9 9a1.5 1.5 0 0 1-2.1-2.1l8.3-8.3"/></svg>
            </button>
            <label for="question" class="sr-only">Câu hỏi</label>
            <input id="question" name="question" placeholder="Nhập câu hỏi của bạn…" maxlength="500" autocomplete="off" required>
            <button class="send" id="send" type="submit" aria-label="Gửi câu hỏi">↑</button>
          </form>
          <p>Kiểm tra kỳ học và phạm vi áp dụng trong tài liệu được dẫn.</p>
        </div>
      </footer>
    </main>
  </div>
</body>
</html>
